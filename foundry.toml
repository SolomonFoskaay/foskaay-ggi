# globalfolkgames-bs/foundry.toml
# Standalone Foundry project for Foskaay Gasless Games Infrastructure (session rails on Arc).
#
# This is a SEPARATE project from ../evm (the GlobalFolkGames app contracts).
# It deploys its own contracts. GlobalFolkGames plugs into it; the rail never
# depends on GlobalFolkGames.
#
# Local-only for now: compile + test with no chain, no cost, no secrets.
[profile.default]
src = "src"
out = "out"
test = "test"
# demos/ holds real games built on the rail (demos/board/ludo/ = the Ludo demo).
# A game's contract is not part of the deployable core set in src/; it compiles
# through the standard test/ suite, which imports the game. Foundry has a single
# test path, so the game lives in its demo folder and its test lives in test/.
script = "script"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
# via_ir: the IR pipeline resolves "stack too deep" on functions with many
# parameters (handoverMany / settleMany). It is the standard, safe fix and keeps
# the deployed bytecode within the EVM contract size limit.
via_ir = true

remappings = [
    "@openzeppelin/contracts/=lib/vendored-openzeppelin/contracts/",
]

# Arc endpoints (public, no secret). Mainnet added only when we get there.
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.mainnet.arc.io"
