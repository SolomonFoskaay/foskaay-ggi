<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Games by Country | GlobalFolkGames</title>
    <meta property="og:title" content="Games by Country | GlobalFolkGames">
    <meta property="og:description" content="Play classic folk games on-chain with a web2 feel: sign in with email, no wallet popups, no gas, provably fair. Live at globalfolkgames.fun.">
    <meta property="og:image" content="https://globalfolkgames.fun/media/GlobalFolkGames_banner_001.jpeg">
    <meta property="og:url" content="https://globalfolkgames.fun/countries/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Games by Country | GlobalFolkGames">
    <meta name="twitter:description" content="Play classic folk games on-chain with a web2 feel: sign in with email, no wallet popups, no gas, provably fair. Live at globalfolkgames.fun.">
    <meta name="twitter:image" content="https://globalfolkgames.fun/media/GlobalFolkGames_banner_001.jpeg">
    <meta name="description" content="Native games by country: see whose classics are on the platform and which folk games are next, ranked by the biggest native-gamer audiences.">
    <link rel="stylesheet" href="/style.css">
    <style>
        .searchbar { width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.06); color:#fff; font-size:0.9rem; box-sizing:border-box; }
        .country-grid { display:grid; grid-template-columns:1fr; gap:12px; margin-top:12px; }
        @media(min-width:640px){ .country-grid{ grid-template-columns:1fr 1fr; } }
        .ccard { background:#1a1a24; border:1px solid #2a2a36; border-radius:12px; padding:14px; }
        .ccard .flag { font-size:2rem; }
        .ccard h3 { margin:6px 0 2px; }
        .ccard .stats { font-size:0.78rem; color:#f87818; margin:2px 0 8px; }
        .ccard .tag { display:inline-block; font-size:0.74rem; border-radius:999px; padding:4px 10px; margin:4px 6px 0 0; cursor:pointer; text-decoration:none; }
        .tag.play { background:rgba(46,204,113,0.18); color:#2ecc71; border:1px solid rgba(46,204,113,0.4); }
        .tag.soon { background:rgba(255,255,255,0.06); color:#bbb; border:1px solid #333; }
    </style>
</head>
<body>
    <main class="mobile-container">
        <section class="onboarding-billboard">
            <h2>🌍 Native games by country</h2>
            <p class="auth-hint" style="margin-top:8px;">How good are you at your native games? Join ongoing competitions, prove your experience and share rewards. We focus first on the countries with the biggest native-gamer audiences.</p>
        </section>

        <section class="game-card">
            <input id="country-search" class="searchbar" placeholder="Search by country or game..." autocomplete="off">
            <div class="country-grid" id="country-grid"></div>
            <p class="auth-hint" style="margin-top:10px;">Looking to play rather than browse? <a href="/games/" style="color:#f87818;">Browse the games</a> or <a href="/competitions/" style="color:#f87818;">join a competition</a>.</p>
        </section>
    </main>

    <script src="/global_header.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            var esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            var COUNTRY_MAP = { china: 'China', india: 'India', 'united states': 'United States', brazil: 'Brazil', indonesia: 'Indonesia', japan: 'Japan', germany: 'Germany', 'south korea': 'South Korea', 'united kingdom': 'United Kingdom', france: 'France', nigeria: 'Nigeria', egypt: 'Egypt', 'south africa': 'South Africa' };
            var r = await fetch('/games/data.json', { cache: 'no-store' });
            var data = (await r.json()).games || [];
            function find(slug) { return data.find(g => g.slug === slug); }
            var COUNTRIES = [
                { flag: '🇮🇳 🇮🇷 🇪🇸 🇮🇹', country: 'MultiNations', stats: 'Boards more than one people changed', note: 'Some boards crossed more than one courtyard before they became the game people play today. MultiNations is where we keep those honestly. Each game still names the peoples who changed it. We do not invent a flag for the whole world.', games: ['chess'] },
                { flag: '🇨🇳', country: 'China', stats: '~728M gamers', games: ['mahjong', 'weiqi', 'xiangqi'] },
                { flag: '🇮🇳', country: 'India', stats: '~500-560M gamers', games: ['pachisi', 'carrom', 'Gyan Chaupar'] },
                { flag: '🇺🇸', country: 'United States', stats: '~215-224M gamers', games: ['euchre', 'spades', 'chunkey'] },
                { flag: '🇧🇷', country: 'Brazil', stats: '~80-95M gamers', games: ['buraco-canastra', 'truco', 'domino'] },
                { flag: '🇮🇩', country: 'Indonesia', stats: '~75-85M gamers', games: ['congklak', 'gobak-sodor', 'bola-bekel'] },
                { flag: '🇯🇵', country: 'Japan', stats: '~73M gamers', games: ['shogi', 'hanafuda', 'sugoroku'] },
                { flag: '🇩🇪', country: 'Germany', stats: '~56M gamers', games: ['doppelkopf', 'skat', 'muhle'] },
                { flag: '🇰🇷', country: 'South Korea', stats: '~42M gamers', games: ['yut-nori', 'go-stop', 'janggi'] },
                { flag: '🇬🇧', country: 'United Kingdom', stats: '~41M gamers', games: ['uckers', 'nine-mens-morris', 'cribbage'] },
                { flag: '🇫🇷', country: 'France', stats: '~40M gamers', games: ['tarot', 'belote', 'jeu-de-loie'] },
                { flag: '🇳🇬', country: 'Nigeria', stats: '~100M gamers', games: ['ayo-olopon', 'nigerian-drafts', 'whon'] },
                { flag: '🇪🇬', country: 'Egypt', stats: '~40-50M gamers', games: ['senet', 'tawla', 'mehen'] },
                { flag: '🇿🇦', country: 'South Africa', stats: '~25-30M gamers', games: ['morabaraba', 'diketo', 'nshuva'] }
            ];
            var grid = document.getElementById('country-grid');
            function render(q) {
                q = (q || '').toLowerCase();
                var list = COUNTRIES.filter(function (c) {
                    if (!q) return true;
                    return (c.country + ' ' + c.games.map(slug => (find(slug) || { name: '' }).name).join(' ')).toLowerCase().indexOf(q) !== -1;
                });
                grid.innerHTML = list.map(function (c) {
                    var games = c.games.map(function (slug) {
                        var g = find(slug) || { name: slug, status: 'soon' };
                        var cls = g.status === 'live' ? 'play' : 'soon';
                        var lbl = g.status === 'live' ? (g.name + ' · play') : (g.name + ' · soon');
                        if (slug === 'pachisi' || slug === 'ludo') { cls = 'play'; lbl = 'Ludo · play'; }
                        return '<a class="tag ' + cls + '" href="/games/game.html?g=' + encodeURIComponent(slug) + '">' + esc(lbl) + '</a>';
                    }).join('');
                    return '<div class="ccard"><span class="flag">' + c.flag + '</span><h3>' + esc(c.country) + '</h3>' +
                        '<div class="stats">' + esc(c.stats) + '</div>' +
                        (c.note ? '<p style="color:#aaa;font-size:0.78rem;line-height:1.6;margin:6px 0 8px;">' + esc(c.note) + '</p>' : '') +
                        '<div>' + games + '</div></div>';
                }).join('') || '<p class="empty">No match for that search.</p>';
            }
            document.getElementById('country-search').addEventListener('input', function () { render(this.value); });
            render('');
        });
    </script>
</body>
</html>
