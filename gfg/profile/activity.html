<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>On-chain activity | Profile | GlobalFolkGames</title>
    <meta property="og:title" content="On-chain activity | Profile | GlobalFolkGames">
    <meta property="og:description" content="Play classic folk games on-chain with a web2 feel: sign in with email, no wallet popups, no gas, provably fair. Live at globalfolkgames.fun.">
    <meta property="og:image" content="https://globalfolkgames.fun/media/GlobalFolkGames_banner_001.jpeg">
    <meta property="og:url" content="https://globalfolkgames.fun/profile/activity.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="On-chain activity | Profile | GlobalFolkGames">
    <meta name="twitter:description" content="Play classic folk games on-chain with a web2 feel: sign in with email, no wallet popups, no gas, provably fair. Live at globalfolkgames.fun.">
    <meta name="twitter:image" content="https://globalfolkgames.fun/media/GlobalFolkGames_banner_001.jpeg">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <main class="mobile-container dash-rail-content">
        <section class="onboarding-billboard">
            <h2>🔗 On-chain activity</h2>
            <p class="auth-hint" id="activity-status" style="margin-top:8px;">Checking account…</p>
        </section>

        <section class="game-card">
            <h3>Your verifiable transactions</h3>
            <p style="color:var(--muted); font-size:0.82rem; line-height:1.5;">Every Ludo roll and win reward is a verifiable transaction on the Solana devnet. Click a signature to verify it on-chain (SolanaFM, alt = official explorer).</p>
            <div id="profile-ontx-list"><p class="empty">Loading…</p></div>
        </section>
    </main>

    <script src="/global_header.js"></script>
    <script src="/gfg-explorer.js"></script>
    <script src="/profile-core.js"></script>
        <script src="/pager.js"></script>
    <script src="/dash-nav.js"></script>
    <script src="/universal/ledgers/global-ledger.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.GFG_DASH_NAV.render({
                brand: '👤 Profile',
                active: 'activity',
                sections: [
                    { heading: 'Overview', items: [
                        { key: 'home', label: '🏠 Profile home', href: '/profile/' },
                    ]},
                    { heading: 'Detail', items: [
                        { key: 'points', label: '⭐ Points and level', href: '/profile/points.html' },
                        { key: 'upgrade', label: '⬆️ Upgrade subscription', href: '/profile/upgrade.html' },
                        { key: 'subscription', label: '💎 Premium subscription', href: '/profile/subscription.html' },
                                                { key: 'affiliate', label: '🤝 Affiliate earnings', href: '/profile/affiliate.html' },
                        { key: 'activity', label: '🔗 On-chain activity', href: '/profile/activity.html' },
                    ]},
                ]
            });

            const statusEl = document.getElementById('activity-status');
            const ontxList = document.getElementById('profile-ontx-list');

            function walletConnected() {
                try {
                    if (window.getDynamicSolanaWallet) {
                        const w = window.getDynamicSolanaWallet();
                        if (w) return true;
                    }
                    if (window.currentProfile && window.currentProfile.solana_wallet) return true;
                } catch (e) { /* ignore */ }
                return false;
            }

            function render(signedIn) {
                if (!signedIn) {
                    if (!walletConnected()) {
                        statusEl.textContent = 'Sign in from the menu at the top to see your on-chain activity.';
                        return;
                    }
                    statusEl.textContent = 'Signed in, loading your activity...';
                    return;
                }
                statusEl.textContent = 'Signed in — welcome back!';
                window.ProfileCore.loadOnchainActivity(ontxList, { full: true });
            }

            render(!!window.currentUser);
            if (window.refreshAuthHeader) {
                window.refreshAuthHeader().then(() => render(!!window.currentUser)).catch(() => render(false));
            }
            // Re-render when the user signs in / out on the same page (the
            // global header is the single sign-in/out source).
            if (typeof window.addEventListener === 'function') {
                window.addEventListener('gfg:auth-changed', () => render(!!window.currentUser));
            }
        });
    </script>
</body>
</html>
