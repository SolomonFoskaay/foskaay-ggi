<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallets & accounts | Dashboard | GlobalFolkGames</title>
    <meta property="og:title" content="Wallets & accounts | Dashboard | GlobalFolkGames">
    <meta property="og:description" content="Play classic folk games on-chain with a web2 feel: sign in with email, no wallet popups, no gas, provably fair. Live at globalfolkgames.fun.">
    <meta property="og:image" content="https://globalfolkgames.fun/media/GlobalFolkGames_banner_001.jpeg">
    <meta property="og:url" content="https://globalfolkgames.fun/dashboard/accounts.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Wallets & accounts | Dashboard | GlobalFolkGames">
    <meta name="twitter:description" content="Play classic folk games on-chain with a web2 feel: sign in with email, no wallet popups, no gas, provably fair. Live at globalfolkgames.fun.">
    <meta name="twitter:image" content="https://globalfolkgames.fun/media/GlobalFolkGames_banner_001.jpeg">
    <link rel="stylesheet" href="/style.css">
    <style>
        .mini-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .mini-table th, .mini-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #23232b; }
        .mini-table th { color: var(--muted); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.03em; }
        .mini-table td { color: #ddd; }
        .mini-table .mono { font-family: monospace; font-size: 0.78rem; color: #9bd4ff; word-break: break-all; }
        .muted-note { color: var(--muted); font-size: 0.82rem; line-height: 1.5; margin-top: 6px; }
        .refresh-btn {
            background: var(--accent, #f87818); color: #1a1a1a; border: none; border-radius: 8px;
            padding: 8px 16px; font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-top: 10px;
        }
        .refresh-btn:disabled { opacity: 0.5; }
        .table-wrap { overflow-x: auto; margin-top: 8px; }
    </style>
</head>
<body>

    <main class="mobile-container dash-rail-content" style="max-width:900px;">
        <section class="onboarding-billboard" style="border-color:#7838f8;">
            <h2>🔑 Wallets &amp; accounts</h2>
            <p class="auth-hint" style="margin-top:8px;">Every wallet and PDA the site touches: what it is, who pays (gasless), live ER delegation, and latest on-chain txs. Click a signature to verify.</p>
        </section>

        <section class="game-card" style="text-align:left;">
            <h3>Accounts tracker <span class="last-checked" id="acc-last-checked"></span></h3>
            <div class="table-wrap">
                <div id="dash-accounts-list"><p class="empty">Loading…</p></div>
            </div>
            <button class="refresh-btn" id="acc-refresh">↻ Refresh</button>
        </section>
    </main>

    <script src="/global_header.js"></script>
    <script src="/gfg-explorer.js"></script>
    <script src="/changelog/render.js"></script>
    <script src="/dash-core.js"></script>
        <script src="/pager.js"></script>
<script src="/dash-nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const staff = await window.DashCore.gateStaff();
            if (!staff) return;

            window.GFG_DASH_NAV.render({
                brand: '🛡 Dashboard',
                active: 'accounts',
                sections: [
                    { heading: 'Overview', items: [
                        { key: 'home', label: '🏠 Dashboard home', href: '/dashboard/' },
                    ]},
                    { heading: 'Detail', items: [
                        { key: 'ops', label: '⚙️ Project ops', href: '/dashboard/ops.html' },
                        { key: 'endpoints', label: '🩺 Endpoint watchlist', href: '/dashboard/endpoints.html' },
                        { key: 'activity', label: '👥 Player activity', href: '/dashboard/activity.html' },
                        { key: 'accounts', label: '🔑 Wallets & accounts', href: '/dashboard/accounts.html' },
                        { key: 'premium', label: '💎 Premium credit', href: '/dashboard/premium.html' },
                        { key: 'premium-subscribers', label: '📈 Premium tracker', href: '/dashboard/premium-subscribers.html' },
                                                { key: 'affiliate', label: '🤝 Affiliate payouts', href: '/dashboard/affiliate.html' },
                        { key: 'release', label: '📊 Release pipeline', href: '/dashboard/release.html' },
                    ]},
                    { heading: 'Staff', items: [
                        { key: 'content-guide', label: '✏ Content style guide', href: '/dashboard/content-style-guide.html' },
                    ]},
                ]
            });

            const dc = window.DashCore;
            function refresh() {
                dc.loadProbe({
                    opsEl: null,
                    epEl: null,
                    accountsEl: 'dash-accounts-list',
                    accountsLastEl: 'acc-last-checked',
                    refreshBtn: 'acc-refresh',
                });
            }
            document.getElementById('acc-refresh').addEventListener('click', refresh);
            refresh();
        });
    </script>
</body>
</html>
