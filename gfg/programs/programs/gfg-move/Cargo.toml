[package]
name = "gfg-move"
version = "0.1.0"
description = "GlobalFolkGames ER game-move experiment program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "gfg_move"

[features]
anchor-debug = []
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "vrf"] }

[dev-dependencies]