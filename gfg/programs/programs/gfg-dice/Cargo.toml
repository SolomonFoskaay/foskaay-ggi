[package]
name = "gfg-dice"
version = "0.1.0"
description = "GlobalFolkGames provably-fair dice via MagicBlock VRF"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "gfg_dice"

[features]
anchor-debug = []
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
borsh = "1.5.7"
# VRF module ships with the ephemeral-rollups-sdk crate.
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor", "vrf"] }

[dev-dependencies]