# evm/foundry.toml — Arc rail (arcv2m16) Phase 0.
# Local-only for now: compile + test with no chain, no cost, no secrets.
[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = []
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

# Arc endpoints (public, no secret). Mainnet added only when we get there.
[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.mainnet.arc.io"
