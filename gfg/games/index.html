<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Games | GlobalFolkGames</title>
    <meta property="og:title" content="Games | GlobalFolkGames">
    <meta property="og:description" content="Play classic folk games on-chain with a web2 feel: sign in with email, no wallet popups, no gas, provably fair. Live at globalfolkgames.fun.">
    <meta property="og:image" content="https://globalfolkgames.fun/media/GlobalFolkGames_banner_001.jpeg">
    <meta property="og:url" content="https://globalfolkgames.fun/games/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Games | GlobalFolkGames">
    <meta name="twitter:description" content="Play classic folk games on-chain with a web2 feel: sign in with email, no wallet popups, no gas, provably fair. Live at globalfolkgames.fun.">
    <meta name="twitter:image" content="https://globalfolkgames.fun/media/GlobalFolkGames_banner_001.jpeg">
    <meta name="description" content="Browse the world's native games: play available classics like Ludo, and follow the folk games coming from every country.">
    <link rel="stylesheet" href="/style.css">
    <style>
        .searchbar { width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.06); color:#fff; font-size:0.9rem; box-sizing:border-box; }
        .game-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
        @media(min-width:640px){ .game-grid{ grid-template-columns:1fr 1fr 1fr 1fr; } }
        .tile { background:#1a1a24; border:1px solid #2a2a36; border-radius:12px; padding:14px 12px; text-align:center; cursor:pointer; text-decoration:none; display:block; color:inherit; }
        .tile.live { border-color:rgba(46,204,113,0.45); }
        .tile:hover { border-color:rgba(243,156,18,0.5); }
        .tile .icon { font-size:1.8rem; }
        .tile h3 { margin:8px 0 2px; }
        .tile .orig { font-size:0.72rem; color:#888; }
        .tile .badge { display:inline-block; margin-top:8px; font-size:0.68rem; border-radius:999px; padding:3px 9px; }
        .badge.play { background:rgba(46,204,113,0.18); color:#2ecc71; border:1px solid rgba(46,204,113,0.4); }
        .badge.soon { background:rgba(255,255,255,0.06); color:#888; border:1px dashed #333; }
    </style>
</head>
<body>
    <main class="mobile-container dash-rail-content">
        <section class="onboarding-billboard">
            <h2>🎮 Native games from around the world</h2>
            <p class="auth-hint" style="margin-top:8px;">How good are you at your native games? Play the classics, and more folk games are joining from every country.</p>
        </section>

        <section class="game-card">
            <input id="game-search" class="searchbar" placeholder="Search games..." autocomplete="off">
            <div class="game-grid" id="game-grid"></div>
            <p class="auth-hint" style="margin-top:10px;">Tap any game to open its page. Playing one seems fine? <a href="/countries/" style="color:#f87818;">Explore games by country</a> or <a href="/competitions/" style="color:#f87818;">join the monthly Member Cup</a>.</p>
        </section>
    </main>

    <script src="/global_header.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            var grid = document.getElementById('game-grid');
            var esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            var r = await fetch('/games/data.json', { cache: 'no-store' });
            var j = await r.json();
            var GAMES = j.games || [];
            function render(q) {
                var list = GAMES.filter(g => (g.name + ' ' + g.history).toLowerCase().indexOf((q || '').toLowerCase()) !== -1);
                grid.innerHTML = list.map(g =>
                    '<a class="tile ' + (g.status === 'live' ? 'live' : '') + '" href="/games/game.html?g=' + encodeURIComponent(g.slug) + '">' +
                    '<div class="icon">' + g.emoji + '</div><h3>' + esc(g.name) + '</h3>' +
                    '<div class="orig">' + (g.region
                        ? esc(g.region) + ' · ' + (g.origins || []).map(o => o.country).join(', ')
                        : (g.origins || []).map(o => o.flag).join(' ') + ' ' + (g.origins || []).map(o => o.country).join(', ')) + '</div>' +
                    (g.status === 'live' ? '<span class="badge play">Play now</span>' : '<span class="badge soon">Coming soon</span>') +
                    '</a>').join('') || '<p class="empty">No game matches that search.</p>';
            }
            document.getElementById('game-search').addEventListener('input', function () { render(this.value); });
            render('');
        });
    </script>
</body>
</html>
