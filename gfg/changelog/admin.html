<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Changelog Admin (Raw) | GlobalFolkGames</title>
    <meta property="og:title" content="Changelog Admin (Raw) | GlobalFolkGames">
    <meta property="og:description" content="Play classic folk games on-chain with a web2 feel: sign in with email, no wallet popups, no gas, provably fair. Live at globalfolkgames.fun.">
    <meta property="og:image" content="https://globalfolkgames.fun/media/GlobalFolkGames_banner_001.jpeg">
    <meta property="og:url" content="https://globalfolkgames.fun/changelog/admin.html">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Changelog Admin (Raw) | GlobalFolkGames">
    <meta name="twitter:description" content="Play classic folk games on-chain with a web2 feel: sign in with email, no wallet popups, no gas, provably fair. Live at globalfolkgames.fun.">
    <meta name="twitter:image" content="https://globalfolkgames.fun/media/GlobalFolkGames_banner_001.jpeg">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/changelog/changelog.css">
</head>
<body>

    <main class="changelog-page admin">
        <section class="changelog-head">
            <a href="/" class="changelog-back">← Home</a>
            <h2>Changelog, engineer view</h2>
            <p class="changelog-sub">Full details, technical bullets and git refs. Staff only (admin / moderator wallets).</p>
            <div class="changelog-meta">
                <span class="changelog-current">Current version <b>v<span id="changelog-version">—</span></b></span>
                <span id="changelog-role" class="changelog-role"></span>
                <a href="/changelog/economics.html" class="changelog-admin-link">Game Economics →</a>
                <a href="/changelog/architecture.html" class="changelog-admin-link">Architecture (Modules) →</a>
                <a href="/changelog/research.html" class="changelog-admin-link">Research (pre-architecture) →</a>
                <a href="/changelog/tests.html" class="changelog-admin-link">Test results (built + measured) →</a>
                <a href="/changelog/" class="changelog-admin-link">Public view →</a>
            </div>
        </section>

        <div id="changelog-entries" class="changelog-entries">
            <p class="empty">Checking access…</p>
        </div>
    </main>

    <!-- Global scripts (needed for points + auth → wallet role) -->
    <script src="/global_header.js"></script>
    <script src="/changelog/render.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.requireStaffAccess) {
                const role = await window.requireStaffAccess();
                // Non-staff are bounced home inside requireStaffAccess.
                if (role && window.renderChangelog) window.renderChangelog('admin');
            } else if (window.renderChangelog) {
                window.renderChangelog('admin');
            }
        });
    </script>
</body>
</html>
